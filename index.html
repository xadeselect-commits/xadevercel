<style>
  :root {
    --bg: #eef0f6;
    --grid: rgba(120, 130, 160, .16);
    --card: #ffffff;
    --card-border: rgba(20, 24, 40, .06);
    --text: #0f1220;
    --muted: #4a5068;
    --chip: #eef0f6;
    --chip-border: rgba(20, 24, 40, .12);
    --icon-bg: #f4f5fa;
    --shadow: 0 6px 22px rgba(30, 40, 80, .08);
    --bg-image-opacity: .32;
    --accent: #3b82f6;
    --online: #22c55e;
  }
  :root[data-theme="dark"] {
    --bg: #0e1018;
    --grid: rgba(150, 160, 200, .09);
    --card: #181b27;
    --card-border: rgba(255, 255, 255, .07);
    --text: #f2f4fb;
    --muted: #a3a9c0;
    --chip: #23273a;
    --chip-border: rgba(255, 255, 255, .12);
    --icon-bg: #23273a;
    --shadow: 0 6px 22px rgba(0, 0, 0, .35);
    --bg-image-opacity: .2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: background .3s ease, color .3s ease;
  }

  /* Background 9:16 dengan opacity diturunkan + grid */
  .bg-image {
    position: fixed; inset: 0; z-index: -2;
    background: url("https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792202764073-1t824a.jpg") center / cover no-repeat;
    opacity: var(--bg-image-opacity);
    transition: opacity .3s ease;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .page {
    width: 100%; max-width: 480px; margin: 0 auto;
    padding: 18px 18px 110px;
  }

  /* Bar atas */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--card-border);
    padding: 9px 16px; border-radius: 999px; box-shadow: var(--shadow);
    font-weight: 600; font-size: 14px; color: var(--muted);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--online); box-shadow: 0 0 0 0 rgba(34,197,94,.55); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--card-border);
    background: var(--card); color: var(--text); box-shadow: var(--shadow);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn .sun { display: none; }
  :root[data-theme="dark"] .icon-btn .sun { display: block; }
  :root[data-theme="dark"] .icon-btn .moon { display: none; }

  /* Banner + avatar */
  .hero { position: relative; margin-bottom: 70px; }
  .banner {
    width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;
    border-radius: 22px; box-shadow: var(--shadow); background: var(--chip);
  }
  .avatar {
    position: absolute; left: 50%; bottom: -62px; transform: translateX(-50%);
    width: 124px; height: 124px; border-radius: 50%; object-fit: cover;
    border: 5px solid var(--bg); outline: 2px solid var(--chip-border);
    box-shadow: 0 8px 24px rgba(0,0,0,.18); background: var(--chip);
  }

  .identity { text-align: center; margin-bottom: 22px; }
  .name {
    font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 700;
    font-size: 30px; letter-spacing: -.3px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .name svg { width: 22px; height: 22px; color: var(--accent); }
  .tagline { margin-top: 6px; color: var(--muted); font-size: 16px; line-height: 1.4; }

  /* Statistik */
  .stats {
    display: inline-flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 6px 14px; margin-top: 18px; padding: 12px 22px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 999px; box-shadow: var(--shadow);
    color: var(--muted); font-size: 16px;
  }
  .stats b { color: var(--text); font-weight: 700; }
  .stats .sep { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: .5; }

  /* Daftar link */
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 22px; padding: 14px 14px; box-shadow: var(--shadow);
    text-decoration: none; color: var(--text);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .link:hover { transform: translateY(-2px); }
  .link:active { transform: scale(.985); }
  .link:focus-visible, .icon-btn:focus-visible, .music:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 3px;
  }
  .ico {
    flex: none; width: 50px; height: 50px; border-radius: 16px;
    background: var(--icon-bg); border: 1px solid var(--chip-border);
    display: grid; place-items: center;
  }
  .ico svg { width: 26px; height: 26px; }
  .label { flex: 1; font-size: 17px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .open {
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    background: var(--chip); border: 1px solid var(--chip-border);
    padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
  }
  .open svg { width: 15px; height: 15px; }

  .footer { margin-top: 34px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; padding: 0 10px; }

  /* Tombol musik */
  .music {
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--card); color: var(--text); border: 1px solid var(--card-border);
    padding: 14px 20px; border-radius: 999px; box-shadow: 0 10px 30px rgba(20,30,70,.18);
    font: 600 16px "Inter", system-ui, sans-serif; cursor: pointer; z-index: 10;
  }
  .music svg { width: 20px; height: 20px; }
  .music .i-pause { display: none; }
  .music.playing .i-pause { display: block; }
  .music.playing .i-play { display: none; }
  .music .eq { display: none; gap: 2px; align-items: flex-end; height: 16px; }
  .music.playing .eq { display: inline-flex; }
  .eq i { width: 3px; background: var(--accent); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(1) { height: 6px; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 14px; animation-delay: .2s; }
  .eq i:nth-child(3) { height: 9px; animation-delay: .4s; }
  @keyframes eq { 50% { transform: scaleY(.35); } }

  @media (prefers-reduced-motion: reduce) {
    .dot, .eq i { animation: none; }
    .link { transition: none; }
  }
  @media (max-width: 360px) {
    .open span { display: none; }
    .name { font-size: 26px; }

</style>

<script>
  /* Tema */
  (function () {
    var root = document.documentElement, saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    if (saved) root.setAttribute("data-theme", saved);
    else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) root.setAttribute("data-theme", "dark");
    document.getElementById("theme").addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  })();

  /* Musik: coba autoplay; jika diblokir browser, mulai saat interaksi pertama */
  (function () {
    var audio = document.getElementById("bgm");
    var btn = document.getElementById("music");
    var label = document.getElementById("musicLabel");
    var userPaused = false;
    audio.volume = 0.7;

    function sync() {
      var playing = !audio.paused;
      btn.classList.toggle("playing", playing);
      label.textContent = playing ? "Jeda" : "Musik";
    }
    function start() { return audio.play().then(sync).catch(function () { sync(); }); }

    audio.addEventListener("play", sync);
    audio.addEventListener("pause", sync);

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (audio.paused) { userPaused = false; start(); }
      else { userPaused = true; audio.pause(); }
    });

    // 1) Autoplay langsung
    start();

    // 2) Cadangan: mulai di sentuhan/klik/scroll pertama (kebijakan browser)
    var events = ["pointerdown", "touchstart", "keydown", "wheel", "scroll"];
    function unlock() {
      if (!userPaused && audio.paused) start();
      if (!audio.paused) events.forEach(function (ev) { window.removeEventListener(ev, unlock, true); });
    }
    events.forEach(function (ev) { window.addEventListener(ev, unlock, { capture: true, passive: true }); });
  })();
</script>
