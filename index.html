<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XadeSL - Welcome</title>
<meta name="description" content="Welcome to my site, make yourself comfortable using the Xade bot feature.">
<link rel="icon" href="https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792201789354-6mylq5.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef0f6; --grid:rgba(120,130,160,.16); --card:rgba(255,255,255,.74); --cb:rgba(20,24,40,.08);
    --text:#0f1220; --muted:#4a5068; --chip:#eef0f6; --shadow:0 10px 30px rgba(30,40,80,.14);
    --bgo:.5; --veil:rgba(238,240,246,.4); --a1:#3b82f6; --a2:#8b5cf6; --online:#22c55e;
  }
  :root[data-theme="dark"] {
    --bg:#0b0d15; --grid:rgba(150,160,200,.08); --card:rgba(20,23,35,.68); --cb:rgba(255,255,255,.09);
    --text:#f4f5fb; --muted:#aab0c6; --chip:#23273a; --shadow:0 10px 30px rgba(0,0,0,.45);
    --bgo:.45; --veil:rgba(11,13,21,.5);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { min-height:100%; }
  body {
    min-height:100dvh; font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); overflow-x:hidden;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
    transition:background .3s, color .3s, opacity .35s;
  }
  body.leaving { opacity:0; }

  .bg { position:fixed; inset:0; z-index:-4; opacity:var(--bgo);
    background:url("https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792263802307-6h07g2.jpg") center/cover no-repeat; }
  .veil { position:fixed; inset:0; z-index:-3; background:linear-gradient(var(--veil),transparent 35%,transparent 65%,var(--veil)); }
  .grid { position:fixed; inset:0; z-index:-2; pointer-events:none; background-size:40px 40px;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); }
  .blob { position:fixed; z-index:-1; width:260px; height:260px; border-radius:50%; filter:blur(70px); opacity:.35; pointer-events:none; animation:drift 14s ease-in-out infinite alternate; }
  .b1 { background:var(--a1); top:-60px; left:-80px; }
  .b2 { background:var(--a2); bottom:-70px; right:-90px; animation-delay:-6s; }
  @keyframes drift { to { transform:translate(40px,50px) scale(1.15); } }

  .wrap { width:100%; max-width:460px; margin:0 auto; padding:18px 18px 100px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .status, .icon-btn { background:var(--card); border:1px solid var(--cb); box-shadow:var(--shadow); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .status { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; font-weight:600; font-size:14px; color:var(--muted); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--online); animation:pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.55);} 70%,100%{box-shadow:0 0 0 8px rgba(34,197,94,0);} }
  .icon-btn { width:44px; height:44px; border-radius:50%; color:var(--text); display:grid; place-items:center; cursor:pointer; }
  .icon-btn svg { width:20px; height:20px; }
  .icon-btn .sun { display:none; }
  :root[data-theme="dark"] .icon-btn .sun { display:block; }
  :root[data-theme="dark"] .icon-btn .moon { display:none; }

  .main { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .hero { position:relative; margin-bottom:68px; }
  .banner { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; border-radius:24px; box-shadow:var(--shadow); background:var(--chip); }
  .avatar { position:absolute; left:50%; bottom:-56px; transform:translateX(-50%); width:112px; height:112px; border-radius:50%; object-fit:cover;
    border:5px solid var(--bg); box-shadow:0 0 0 2px var(--a1),0 10px 28px rgba(59,130,246,.35); background:var(--chip); }

  h1 { font-family:"Space Grotesk","Inter",sans-serif; font-size:clamp(32px,10vw,42px); line-height:1.08; letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--text),var(--a1) 55%,var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:12px; color:var(--muted); font-size:17px; line-height:1.5; padding:0 6px; }
  .sub b { color:var(--text); font-weight:600; }

  .stats { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:11px 18px; border-radius:999px; font-size:15px; color:var(--muted);
    background:var(--card); border:1px solid var(--cb); box-shadow:var(--shadow); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .pill b { color:var(--text); font-weight:700; }
  .pill svg { width:17px; height:17px; color:var(--a1); }

  .cta { position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:10px; align-self:center;
    margin-top:28px; width:min(100%,320px); padding:17px 28px; border-radius:999px; text-decoration:none; color:#fff; font-weight:700; font-size:17px;
    background:linear-gradient(110deg,var(--a1),var(--a2)); box-shadow:0 12px 30px rgba(99,102,241,.45); animation:glow 2.6s ease-in-out infinite; transition:transform .15s; }
  .cta:active { transform:scale(.97); }
  .cta svg { width:20px; height:20px; transition:transform .25s; }
  .cta:hover svg { transform:translateX(5px); }
  .cta::after { content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg); animation:shine 3.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow:0 14px 40px rgba(139,92,246,.6); } }
  @keyframes shine { 0%{left:-60%;} 55%,100%{left:130%;} }
  .cta:focus-visible,.icon-btn:focus-visible,.music:focus-visible { outline:3px solid var(--a1); outline-offset:3px; }

  .foot { margin-top:26px; text-align:center; color:var(--muted); font-size:13px; }

  .music { position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:10; display:inline-flex; align-items:center; gap:10px;
    padding:13px 19px; border-radius:999px; cursor:pointer; color:var(--text); font:600 15px "Inter",system-ui,sans-serif;
    background:var(--card); border:1px solid var(--cb); box-shadow:0 10px 30px rgba(20,30,70,.2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .music svg { width:19px; height:19px; }
  .music .i-pause, .music .eq { display:none; }
  .music.playing .i-pause { display:block; }
  .music.playing .i-play { display:none; }
  .music.playing .eq { display:inline-flex; gap:2px; align-items:flex-end; height:16px; }
  .eq i { width:3px; background:var(--a1); border-radius:2px; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(1){height:6px;} .eq i:nth-child(2){height:14px;animation-delay:.2s;} .eq i:nth-child(3){height:9px;animation-delay:.4s;}
  @keyframes eq { 50% { transform:scaleY(.35); } }

  /* Testimoni */
  html { scroll-behavior:smooth; }
  .screen { min-height:calc(100dvh - 18px - env(safe-area-inset-top,0px)); display:flex; flex-direction:column; }
  .hint { margin-top:auto; padding-top:22px; align-self:center; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:13px; font-weight:500; text-decoration:none; }
  .hint svg { width:20px; height:20px; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(5px); } }
  .testi { margin-top:34px; text-align:center; scroll-margin-top:16px; }
  .testi h2 { font-family:"Space Grotesk","Inter",sans-serif; font-size:30px; letter-spacing:-.3px; }
  .rating { display:inline-flex; align-items:center; gap:14px; margin-top:14px; padding:12px 20px; border-radius:22px; background:var(--card); border:1px solid var(--cb); box-shadow:var(--shadow); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .score { font-family:"Space Grotesk","Inter",sans-serif; font-size:40px; line-height:1; }
  .stars { position:relative; display:inline-block; font-size:22px; letter-spacing:2px; line-height:1; color:rgba(150,155,175,.4); }
  .stars i { position:absolute; left:0; top:0; overflow:hidden; white-space:nowrap; font-style:normal; color:#f5b301; width:var(--w,100%); }
  .rcount { margin-top:5px; font-size:13px; color:var(--muted); text-align:left; }
  .track { display:flex; align-items:flex-start; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; margin:20px -18px 0; padding:6px 18px 14px; scrollbar-width:none; }
  .track::-webkit-scrollbar { display:none; }
  .tcard { flex:none; width:min(72vw,290px); scroll-snap-align:center; overflow:hidden; cursor:zoom-in; background:var(--card); border:1px solid var(--cb); border-radius:20px; box-shadow:var(--shadow); }
  .tcard img { display:block; width:100%; height:auto; background:var(--chip); }
  .tstar { padding:10px 14px; color:#f5b301; font-size:15px; letter-spacing:2px; text-align:left; }
  .dots { display:flex; justify-content:center; gap:7px; margin-top:4px; }
  .dots b { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.35; transition:all .25s; }
  .dots b.on { width:20px; border-radius:4px; background:var(--a1); opacity:1; }
  .reveal { opacity:0; transform:translateY(24px); filter:blur(6px); transition:opacity .8s, transform .8s, filter .8s; }
  .reveal.in { opacity:1; transform:none; filter:none; }
  .lb { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.88); }
  .lb.on { display:flex; }
  .lb img { max-width:100%; max-height:100%; border-radius:14px; }
  @media (prefers-reduced-motion:reduce) { .reveal { opacity:1; transform:none; filter:none; transition:none; } .hint svg { animation:none; } html { scroll-behavior:auto; } }

  /* Fade in bertahap (fade + naik + blur hilang) */
  .rise { opacity:0; transform:translateY(20px); filter:blur(8px); animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:var(--d,0s); }
  @keyframes rise { to { opacity:1; transform:none; filter:none; } }

  @media (prefers-reduced-motion:reduce) {
    .rise { opacity:1; transform:none; filter:none; animation:none; }
    .blob,.dot,.cta,.cta::after,.eq i { animation:none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div><div class="grid" aria-hidden="true"></div>
<div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>

<div class="wrap">
  <div class="screen">
  <div class="top rise" style="--d:.05s">
    <div class="status"><span class="dot"></span>Online</div>
    <button class="icon-btn" id="theme" type="button" aria-label="Ganti tema">
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <main class="main">
    <section class="hero rise" style="--d:.2s">
      <video class="banner" src="/banner.mp4" poster="https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792201706226-msluy9.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-label="Banner XadeSL"></video>
      <img class="avatar" src="https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792201789354-6mylq5.jpg" alt="Foto profil XadeSL">
    </section>

    <h1 class="rise" style="--d:.5s">Welcome to my site</h1>
    <p class="sub rise" style="--d:.75s">make yourself comfortable using the <b>Xade bot</b> feature</p>

    <div class="stats rise" style="--d:1s">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><b><span id="count">1950</span>+</b> Fitur</span>
      <span class="pill">Owner <b>XadeSL</b><svg viewBox="0 0 24 24" aria-label="Terverifikasi"><path fill="currentColor" d="M12 1.8l2.4 1.8 3-.1 1 2.8 2.5 1.7-.9 2.9.9 2.9-2.5 1.7-1 2.8-3-.1L12 22.2l-2.4-1.8-3 .1-1-2.8-2.5-1.7.9-2.9-.9-2.9 2.5-1.7 1-2.8 3 .1z"/><path d="M8 12.2l2.6 2.6L16.2 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>

    <a class="cta rise" id="go" href="/profil/" style="--d:1.25s">Next Site
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </main>
  <a class="hint rise" href="#testi" style="--d:1.5s">Testimoni<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></a>
  </div>

  <section class="testi" id="testi" aria-label="Testimoni">
    <h2 class="reveal">Testimoni</h2>
    <div class="rating reveal">
      <div class="score" id="avg">5,0</div>
      <div><div class="stars" id="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p class="rcount" id="rcount"></p></div>
    </div>
    <div class="track" id="track"></div>
    <div class="dots" id="dots"></div>
  </section>

  <p class="foot rise" style="--d:1.5s">© 2026 XadeSL • All Rights Reserved.</p>
</div>

<div class="lb" id="lb"><img id="lbimg" alt="Testimoni"></div>
<audio id="bgm" src="/music.mp3" loop preload="auto"></audio>
<button class="music" id="music" type="button" aria-label="Putar atau jeda musik">
  <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
  <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  <span id="musicLabel">Musik</span>
</button>

<script>
(function () {
  var root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved) root.setAttribute("data-theme", saved);
  else if (matchMedia("(prefers-color-scheme: dark)").matches) root.setAttribute("data-theme", "dark");
  document.getElementById("theme").addEventListener("click", function () {
    var n = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", n);
    try { localStorage.setItem("theme", n); } catch (e) {}
  });

  /* Hitung naik angka fitur */
  var el = document.getElementById("count"), target = 1950;
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var t0 = null; el.textContent = "0";
    setTimeout(function () {
      requestAnimationFrame(function tick(ts) {
        if (!t0) t0 = ts;
        var p = Math.min((ts - t0) / 1800, 1);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      });
    }, 1000);
  }

  /* Musik: autoplay, cadangan di sentuhan pertama, pause/start */
  var audio = document.getElementById("bgm"), btn = document.getElementById("music"), label = document.getElementById("musicLabel"), userPaused = false;
  audio.volume = 0.7;
  function sync() { var on = !audio.paused; btn.classList.toggle("playing", on); label.textContent = on ? "Jeda" : "Musik"; }
  function start() { return audio.play().then(sync).catch(sync); }
  function save() { try { localStorage.setItem("xade_bgm", JSON.stringify({ t: audio.currentTime, p: userPaused })); } catch (e) {} }
  audio.addEventListener("play", sync); audio.addEventListener("pause", sync);
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (audio.paused) { userPaused = false; start(); } else { userPaused = true; audio.pause(); }
  });
  start();
  var evs = ["pointerdown", "touchstart", "keydown", "wheel", "scroll"];
  function unlock() {
    if (!userPaused && audio.paused) start();
    if (!audio.paused) evs.forEach(function (v) { window.removeEventListener(v, unlock, true); });
  }
  evs.forEach(function (v) { window.addEventListener(v, unlock, { capture: true, passive: true }); });

  /* Next Site: simpan posisi musik, pudar, lalu pindah halaman */
  document.getElementById("go").addEventListener("click", function (e) {
    e.preventDefault();
    var href = this.getAttribute("href");
    save();
    document.body.classList.add("leaving");
    setTimeout(function () { location.href = href; }, 350);
  });
  window.addEventListener("pagehide", save);
})();

(function () {
  var data = [
    { s: "https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792280676945-rkz1l6.jpg", r: 5 },
    { s: "https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792280682469-vwcj5y.jpg", r: 5 },
    { s: "https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792280687809-1ojftd.jpg", r: 5 },
    { s: "https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792280693743-5bc9at.jpg", r: 5 },
    { s: "https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792280700131-rgw6eu.jpg", r: 5 },
    { s: "https://raw.githubusercontent.com/xadeselect-commits/linkgh/main/linkgh/1792280707106-3yukg0.jpg", r: 5 }
  ];
  var n = data.length, sum = 0;
  data.forEach(function (d) { sum += d.r; });
  var avg = sum / n;
  document.getElementById("avg").textContent = avg.toFixed(1).replace(".", ",");
  document.getElementById("stars").innerHTML = "&#9733;&#9733;&#9733;&#9733;&#9733;<i style=\"--w:" + (avg / 5 * 100) + "%\">&#9733;&#9733;&#9733;&#9733;&#9733;</i>";
  document.getElementById("rcount").textContent = "dari " + 6 + " ulasan";

  var track = document.getElementById("track"), dots = document.getElementById("dots");
  var lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
  data.forEach(function (d, i) {
    var c = document.createElement("figure");
    c.className = "tcard reveal";
    var im = document.createElement("img");
    im.src = d.s; im.loading = "lazy"; im.alt = "Testimoni pelanggan " + (i + 1);
    var st = document.createElement("div");
    st.className = "tstar"; st.textContent = new Array(d.r + 1).join("\u2605");
    c.appendChild(im); c.appendChild(st);
    c.addEventListener("click", function () { lbimg.src = d.s; lb.classList.add("on"); });
    track.appendChild(c);
    var dot = document.createElement("b"); if (i === 0) dot.className = "on"; dots.appendChild(dot);
  });
  lb.addEventListener("click", function () { lb.classList.remove("on"); });

  track.addEventListener("scroll", function () {
    var w = track.firstChild.offsetWidth + 14;
    var idx = Math.min(n - 1, Math.max(0, Math.round(track.scrollLeft / w)));
    Array.prototype.forEach.call(dots.children, function (b, k) { b.className = k === idx ? "on" : ""; });
  }, { passive: true });

  var els = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    Array.prototype.forEach.call(els, function (e) { io.observe(e); });
  } else {
    Array.prototype.forEach.call(els, function (e) { e.classList.add("in"); });
  }
})();
</script>
</body>
</html>
